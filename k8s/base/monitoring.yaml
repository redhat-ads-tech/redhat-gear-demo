apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: redhat-gear-alerts
  namespace: redhat-gear
spec:
  groups:
    - name: redhat-gear.rules
      rules:
        - alert: OrderErrorRateHigh
          expr: |
            (
              sum(rate(istio_requests_total{destination_service_name="order-service",response_code=~"5.."}[2m]))
              /
              sum(rate(istio_requests_total{destination_service_name="order-service"}[2m]))
            ) > 0.1
          for: 2m
          labels:
            severity: critical
            namespace: redhat-gear
          annotations:
            summary: "Order service error rate is above 10%"
            description: "The order-service in the redhat-gear namespace has an HTTP 5xx error rate of {{ $value | humanizePercentage }}, exceeding the 10% threshold. Investigate upstream dependencies."
        - alert: InventoryServiceErrorRate
          expr: |
            (
              sum(rate(istio_requests_total{destination_service_name="inventory-service",response_code=~"5..",namespace="redhat-gear"}[2m]))
              /
              sum(rate(istio_requests_total{destination_service_name="inventory-service",namespace="redhat-gear"}[2m]))
            ) > 0.1
          for: 1m
          labels:
            severity: warning
            namespace: redhat-gear
          annotations:
            summary: "Inventory service error rate is above 10%"
            description: "The inventory-service in the redhat-gear namespace has an HTTP 5xx error rate of {{ $value | humanizePercentage }}. This may indicate a problem with an upstream dependency."
