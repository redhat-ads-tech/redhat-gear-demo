apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: redhat-gear-alerts
  namespace: redhat-gear
spec:
  groups:
    - name: redhat-gear.rules
      rules:
        - alert: OrderErrorRateHigh
          expr: |
            (
              sum by(namespace) (rate(istio_requests_total{destination_service_name="order-service",response_code=~"5..",reporter="destination"}[30s]))
              /
              sum by(namespace) (rate(istio_requests_total{destination_service_name="order-service",reporter="destination"}[30s]))
            ) > 0.1
          for: 15s
          labels:
            severity: critical
          annotations:
            summary: "Order service error rate is above 10%"
            description: "The order-service in the redhat-gear namespace has an HTTP 5xx error rate exceeding the 10% threshold. Investigate upstream dependencies."
        - alert: InventoryServiceErrorRate
          expr: |
            (
              sum by(namespace) (rate(istio_requests_total{destination_service_name="inventory-service",response_code=~"5..",namespace="redhat-gear",reporter="destination"}[30s]))
              /
              sum by(namespace) (rate(istio_requests_total{destination_service_name="inventory-service",namespace="redhat-gear",reporter="destination"}[30s]))
            ) > 0.1
          for: 15s
          labels:
            severity: warning
          annotations:
            summary: "Inventory service error rate is above 10%"
            description: "The inventory-service in the redhat-gear namespace has an HTTP 5xx error rate exceeding 10%. This may indicate a problem with an upstream dependency."
